name: CI

on:
  push:
    branches:
      - main

  # Run tests for any PRs.
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        perl:
          - "5.42"
          - "5.40"
          - "5.12"

    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
      - run: perl -V

      - run: cpanm --installdeps .
      - run: prove -lv t

      - run: tail -n 150 /home/runner/.cpanm/work/*/build.log
        if: ${{ failure() && matrix.os == 'ubuntu-latest' }}

      - run: tail -n 150 /Users/runner/.cpanm/work/*/build.log
        if: ${{ failure() && matrix.os == 'macos-latest' }}

  # Single stable check for branch protection, so the ruleset does not need
  # to change when the matrix does.
  tests-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
